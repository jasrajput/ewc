
name: Deploy EWC to AWS Lightsail

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ewc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      
      - name: Deploy backend
        run: |
          rsync -rz \
            -e "ssh -o BatchMode=yes" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='*.log' \
            ./backend/ ubuntu@13.206.187.201:/var/www/ewc/backend/

      - name: Deploy closing-node
        run: |
          rsync -rz \
            -e "ssh -o BatchMode=yes" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='*.log' \
            ./closing-node/ ubuntu@13.206.187.201:/var/www/ewc/closing-node/

      - name: Install dependencies and restart applications
        run: |
          ssh -o BatchMode=yes ubuntu@13.206.187.201 'bash -se' <<'EOF'
            set -e

            cd /var/www/ewc/backend
            npm ci --omit=dev

            cd /var/www/ewc/closing-node
            npm ci --omit=dev

            pm2 restart server --update-env
            pm2 restart processEvents --update-env

            sleep 5
            pm2 list
          EOF
